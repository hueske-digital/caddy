name: Build and Push Watcher image

env:
  IMAGE_NAME: ghcr.io/hueske-digital/caddy
  # Nur main veroeffentlicht das Image, das die Systeme ziehen. Jeder andere
  # Ref - typischerweise ueber workflow_dispatch auf einem Branch - landet auf
  # einem Beta-Tag und laesst den produktiven unangetastet.
  IMAGE_TAG: ${{ github.ref_name == 'main' && 'watcher' || 'watcher-beta' }}

on:
  push:
    branches:
      - main
      - beta
    paths:
      - 'watcher/**'
      - '.github/workflows/watcher-build-push.yml'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: watcher/go.sum

      - name: Check formatting
        working-directory: ./watcher
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt'ed:"; echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: Vet
        working-directory: ./watcher
        run: go vet ./...

      - name: Run unit tests
        working-directory: ./watcher
        run: go test -race -v ./...

      # Sicherheits-Waechter gegen einen Auth-Bypass in forward_auth. Blockiert
      # bewusst: schlaegt er fehl, ist entweder der Fix verloren gegangen oder
      # Caddy hat sein Host-Verhalten geaendert - beides muss auffallen, bevor
      # ein Image entsteht.
      - name: forward_auth bypass guard
        working-directory: ./watcher
        run: bash test/auth-bypass.sh

      # Meldet, blockiert aber nicht: die aktuell erreichbaren Funde stecken in
      # github.com/docker/docker und sind dort mit "Fixed in: N/A" gelistet - es
      # gibt schlicht keine Version, auf die man gehen koennte. Als harter Gate
      # wuerde der Schritt jeden Build dauerhaft verhindern, statt auf Neues
      # aufmerksam zu machen. Die Ausgabe steht in der Zusammenfassung des Runs.
      - name: Check for known vulnerabilities
        continue-on-error: true
        working-directory: ./watcher
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    needs: test

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract platform suffix
        id: platform
        run: echo "suffix=${platform#linux/}" >> $GITHUB_OUTPUT
        env:
          platform: ${{ matrix.platform }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./watcher
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-${{ steps.platform.outputs.suffix }}
          platforms: ${{ matrix.platform }}
          provenance: false

  manifest:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-amd64 \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}-arm64
          docker manifest push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
