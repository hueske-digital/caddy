services:
  app:
    image: ghcr.io/hueske-digital/caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - COMPOSE_PROJECT_NAME
      - LOG_LEVEL=${LOG_LEVEL:-ERROR}
      - CF_API_TOKEN
      - HETZNER_API_TOKEN
      - EMAIL
      # Excluded from SSO cookie stripping in (security) - TinyAuth must keep
      # reading its own session cookie
      - TINYAUTH_DOMAIN=${TINYAUTH_DOMAIN:-tinyauth.invalid}
    entrypoint: /docker/entrypoint.sh
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./hosts:/hosts
      - app_data:/data
      - app_conf:/config
    networks:
      - proxy_apps

  watcher:
    image: ghcr.io/hueske-digital/caddy:watcher
    restart: unless-stopped
    environment:
      - COMPOSE_PROJECT_NAME
      - NETWORK_SUFFIX=${NETWORK_SUFFIX:-_caddy}
      - HOSTS_DIR=${HOSTS_DIR:-/hosts}
      # Needed so the watcher can exempt TinyAuth's own host from the SSO cookie
      # strip - without it TinyAuth could no longer read its own session.
      - TINYAUTH_DOMAIN=${TINYAUTH_DOMAIN:-}
      # Geltungsbereich der TinyAuth-Cookies. Ohne Angabe aus TINYAUTH_DOMAIN
      # abgeleitet (auth.example.com -> example.com). Nur Sites darunter
      # bekommen den Cookie-Strip - andere Domains sehen das Cookie nie.
      - TINYAUTH_COOKIE_DOMAIN=${TINYAUTH_COOKIE_DOMAIN:-}
      - DNS_REFRESH_INTERVAL=${DNS_REFRESH_INTERVAL:-60}
      # Wartezeit, bevor die Config eines verschwundenen Containers entfernt
      # wird. Muss deutlich ueber dem laengsten Update-Fenster liegen - waehrend
      # eines Watchtower-Updates ist ein Container kurzzeitig gar nicht da.
      - CONFIG_CLEANUP_GRACE=${CONFIG_CLEANUP_GRACE:-30m}
      # Status page: set CADDY_DOMAIN in .env to enable
      - CADDY_DOMAIN=${CADDY_DOMAIN:-}
      - CADDY_TYPE=${CADDY_TYPE:-internal}
      - CADDY_PORT=${CADDY_PORT:-8080}
      # Optional: restrict access to specific IPs/hostnames (comma-separated)
      - CADDY_ALLOWLIST=${CADDY_ALLOWLIST:-}
      # Optional: enable authentication (requires docker-compose.auth.yml)
      - CADDY_AUTH=${CADDY_AUTH:-false}
      - CADDY_AUTH_URL=${CADDY_AUTH_URL:-}
      - CADDY_AUTH_PATHS=${CADDY_AUTH_PATHS:-}
      # Optional: restrict access to users with specific groups (comma-separated)
      - CADDY_AUTH_GROUPS=${CADDY_AUTH_GROUPS:-}
      # Optional: link config files to code editor (e.g., https://code.example.com/?folder=/files)
      - CODE_EDITOR_URL=${CODE_EDITOR_URL:-}
      # Optional: domains to generate wildcard certificates for (comma-separated)
      - WILDCARD_DOMAINS=${WILDCARD_DOMAINS:-}
      # Optional: DNS provider for wildcard certs (cloudflare|hetzner, default: cloudflare)
      - WILDCARD_DNS_PROVIDER=${WILDCARD_DNS_PROVIDER:-cloudflare}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./hosts:/hosts
    networks:
      - caddy

networks:
  caddy:
  # Legacy network for existing services with manual configs
  proxy_apps:
    external: true

volumes:
  app_data:
  app_conf: